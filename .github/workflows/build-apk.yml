name: Build VaultCall Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Install dependencies
        run: npm install

      - name: Prebuild Android native project
        env:
          CI: "1"
        run: npx expo prebuild --platform android

      - name: Enable signing on release build for direct phone install
        run: |
          node -e '
          const fs = require("fs");
          const p = "android/app/build.gradle";
          let g = fs.readFileSync(p, "utf8");
          if (g.includes("buildTypes {") && g.includes("signingConfigs") && !/release\s*\{[\s\S]*?signingConfig/.test(g)) {
            g = g.replace(/buildTypes\s*\{([\s\S]*?)release\s*\{/, (m, mid) => `buildTypes {${mid}release {\n            signingConfig signingConfigs.debug`);
            fs.writeFileSync(p, g, "utf8");
          }
          '

      - name: Build Release APK
        run: cd android && ./gradlew assembleRelease

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: VaultCall-Android-APK
          path: android/app/build/outputs/apk/release/app-release.apk